<div class="modal fade" id="addFriendsModal" tabindex="-1" aria-labelledby="addFriendsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addFriendsModalLabel">Gerenciar Amigos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0 d-flex flex-column" style="height:480px;">
                <ul class="nav nav-tabs px-3 pt-3 flex-shrink-0" id="friendsTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#searchPane" type="button" role="tab" aria-controls="searchPane" aria-selected="true">Adicionar Amigos</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="requests-tab" data-bs-toggle="tab" data-bs-target="#requestsPane" type="button" role="tab" aria-controls="requestsPane" aria-selected="false">Solicitações</button>
                    </li>
                </ul>
                <div class="tab-content flex-grow-1 overflow-auto p-3">
                    <div class="tab-pane fade show active h-100" id="searchPane" role="tabpanel" aria-labelledby="search-tab">
                        <form hx-get="{% url 'friend:search_friend' %}" hx-target="#searchResultsList" hx-trigger="submit" class="mb-3">
                            <div class="input-group">
                                <input type="text" name="q" class="form-control" placeholder="Pesquisar usuário..." autocomplete="off" required>
                                <button type="submit" class="btn btn-outline-primary d-flex align-items-center justify-content-center" style="width:45px;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
                                </button>
                            </div>
                        </form>
                        <div id="searchResultsList" class="list-group list-group-flush"></div>
                    </div>
                    <div class="tab-pane fade h-100" id="requestsPane" role="tabpanel" aria-labelledby="requests-tab">
                        {% include "partials/requests_list.html" %}
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>
