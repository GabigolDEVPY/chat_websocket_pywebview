<div id="requestsList" class="list-group list-group-flush">
    {% for request in friends_requests %}
        <!-- MOCK: Item de solicitação recebida -->
        <div class="list-group-item d-flex justify-content-between align-items-center py-2 px-0">
            <div class="d-flex align-items-center gap-2">
                <img src="https://via.placeholder.com/36" class="rounded-circle flex-shrink-0" alt="Avatar">
                <div><strong class="d-block text-dark fs-6">{{ request.friend.username }}</strong><small class="text-muted">@carlos.mendes</small></div>
            </div>
            <div class="d-flex gap-2">
                <button hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-post="{% url "friend:accepted_friend_request" request.id %}" hx-target="#requestsList" type="button" class="btn btn-sm btn-success rounded-pill px-3">Aceitar</button>
                <button type="button" class="btn btn-sm btn-outline-danger rounded-pill px-3">Recusar</button>
            </div>
        </div>
        <!-- FIM MOCK -->
    {% endfor %}
</div>
