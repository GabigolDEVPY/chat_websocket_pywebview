{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Django Channels Chat</title>
    <!-- Mesma versão do Bootstrap usada no chat -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons para manter consistência -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-white">

    <div class="container vh-100 d-flex justify-content-center align-items-center">
        
        <div class="card shadow-sm border-0 p-5 rounded-4" style="width: 100%; max-width: 420px;">
            
            <!-- Ícone e Título alinhados ao estilo do header do chat -->
            <div class="text-center mb-4">
                <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center text-primary mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-chat-dots-fill fs-2"></i>
                </div>
                <h2 class="fw-bold text-dark mb-1">Bem-vindo</h2>
                <p class="text-muted small mb-0">Entre para acessar suas conversas</p>
            </div>

            <form action="{% url 'chat:login' %}" method="post">
                {% csrf_token %}
                
                <!-- Input de Usuário com ícone (mesmo estilo da busca do chat) -->
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-secondary ms-1">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3">
                            <i class="bi bi-person-fill text-muted"></i>
                        </span>
                        <input 
                            type="text" 
                            name="username" 
                            id="username"
                            class="form-control border-start-0 rounded-end-pill py-2" 
                            placeholder="Digite seu usuário" 
                            required
                            autofocus
                        >
                    </div>
                </div>

                <!-- Input de Senha com ícone -->
                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-secondary ms-1">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3">
                            <i class="bi bi-lock-fill text-muted"></i>
                        </span>
                        <input 
                            type="password" 
                            name="password" 
                            id="password"
                            class="form-control border-start-0 rounded-end-pill py-2" 
                            placeholder="Digite sua senha" 
                            required
                        >
                    </div>
                </div>

                <!-- Botão Primary (mesma cor dos botões de ação do chat) -->
                <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-semibold shadow-sm">
                    Entrar
                </button>
            </form>

            <!-- Mensagens de erro do Django (opcional, mas recomendado) -->
            {% if form.errors %}
                <div class="alert alert-danger mt-3 py-2 small rounded-pill text-center border-0 bg-danger bg-opacity-10 text-danger">
                    Usuário ou senha incorretos.
                </div>
            {% endif %}
        </div>

    </div>

    <!-- Bootstrap JS (caso precise de tooltips ou validação futura) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
