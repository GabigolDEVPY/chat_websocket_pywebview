<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    
    <div class="container vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow p-4 w-50 rounded">
            <h2 class="text-center mb-5" >Login</h2>
            <form action="{% url 'chat:login' %}" method="post">
                {% csrf_token %}
                <input class="form-control rounded-pill border-success mb-3" type="text" name="username" placeholder="Usuário" required>
        
                <input class="form-control rounded-pill border-success mb-3" type="password" name="password" placeholder="Senha" required>
        
                <button class="btn btn-success rounded-pill w-50" type="submit">Entrar</button>
            </form>

        </div>

    </div>

</body>
</html>
