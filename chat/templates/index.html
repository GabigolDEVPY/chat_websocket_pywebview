{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Django Channels</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="{% static 'scripts.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous"></script>
</head>
<body>
    <div class="d-flex">

        <!-- conversas-->
        <div class="col-4 border-end vh-100 p-0">
            <div class="p-3 border-bottom">
                <h5>Conversas</h5>
            </div>

            <div class="list-group list-group-flush">
                {% for room in rooms  %}
                    <a onclick="OpenSocket('{{ room.name|escapejs }}')" class="list-group-item list-group-item-action">

                        <div class="d-flex align-items-center">

                            <img src="https://via.placeholder.com/40"class="rounded-circle me-3">

                            <div>
                                <strong>{{ room.name }}</strong>
                                <br>
                                <small class="text-muted">Oi, tudo bem?</small>
                            </div>
                        </div>
                    </a>
                {% endfor %}
            </div>
        </div>

        <div class="col-8 d-flex flex-column p-0">

            <div class="p-3 border-bottom">
                <strong>João</strong>
            </div>


            <div id="messages" class="flex-grow-1 p-3">

                <div class="bg-light rounded p-2">Olá, tudo bem?</div>

            </div>


            <div class="p-3 border-top d-flex gap-2">
                <input id="messageInput" class="form-control rounded-pill" placeholder="Digite uma mensagem">
                <button class="btn btn-success rounded-pill" onclick="SendMessage()" id="sendButton">Enviar</button>
            </div>

        </div>
    </div>





</body>
</html>
